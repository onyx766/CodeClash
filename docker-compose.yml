version: '3.8'
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codeclash
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  code-runner:
    build: ./code-runner
    ports:
      - '5000:5000'
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - SHARED_WORKDIR=/work_shared
    volumes:
      - runner-work:/work_shared

  runner-worker:
    build: ./code-runner
    command: npm run worker
    restart: unless-stopped
    depends_on:
      - dind
      - redis
      - backend
    environment:
      - DOCKER_HOST=tcp://dind:2375
      - REDIS_HOST=redis
      - SHARED_WORKDIR=/work_shared
      - BACKEND_URL=http://backend:3001
    secrets:
      - runner_secret
    volumes:
      - runner-work:/work_shared
    ports:
      - '5001:5001'

  dind:
    image: docker:24-dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    volumes:
      - runner-work:/work_shared
      - dind-data:/var/lib/docker
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/codeclash
      - REDIS_HOST=redis
      - CODE_RUNNER_URL=http://code-runner:5000
      - NODE_ENV=development
    secrets:
      - runner_secret
    depends_on:
      - postgres
      - redis
      - code-runner
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres-data:
  dind-data:
  runner-work:
secrets:
  runner_secret:
    external: true
