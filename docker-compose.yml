# CodeClash - the complete stack on one host.
#
#   ./scripts/init-env.sh          # once: writes .env with generated secrets
#   docker compose up --build -d
#
#   Player app     http://localhost:3000
#   Admin console  http://localhost:7662
#   API            http://localhost:4000/api   (OpenAPI docs: /api/docs)
#
# See docs/deployment.md for configuration, HTTPS and scaling.

name: codeclash

x-runner-env: &runner-env
  REDIS_HOST: redis
  SHARED_WORKDIR: /work_shared
  RUNNER_SECRET: ${RUNNER_SECRET:?RUNNER_SECRET is not set - run ./scripts/init-env.sh (or copy .env.example to .env)}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeclash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run ./scripts/init-env.sh}
      POSTGRES_DB: ${POSTGRES_DB:-codeclash}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Docker daemon that runs every sandboxed job container. It is privileged,
  # so it sits on its own network that only the runner worker joins.
  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    # Hand the shared work volume to the runner's uid (10001) before dockerd
    # starts, whichever container happened to create the volume first.
    entrypoint: ["/bin/sh", "-c", "mkdir -p /work_shared && chown 10001:10001 /work_shared && exec dockerd-entrypoint.sh"]
    networks: [sandbox]
    volumes:
      - runner-work:/work_shared
      - dind-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # Judge API used by the backend: writes each job to the shared volume and
  # queues it in Redis.
  code-runner:
    build: ./code-runner
    image: codeclash/code-runner:local
    restart: unless-stopped
    environment:
      <<: *runner-env
    volumes:
      - runner-work:/work_shared
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Pops queued jobs and runs each one in a locked-down container on dind.
  # Scale with `docker compose up -d --scale runner-worker=N`.
  runner-worker:
    build: ./code-runner
    image: codeclash/code-runner:local
    command: ["node", "dist/worker/src/worker.js"]
    restart: unless-stopped
    environment:
      <<: *runner-env
      DOCKER_HOST: tcp://dind:2375
      BACKEND_URL: http://backend:4000
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-node:22-alpine}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - runner-work:/work_shared
    networks: [default, sandbox]
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_healthy

  backend:
    build: ./backend
    image: codeclash/backend:local
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeclash}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-codeclash}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CODE_RUNNER_URL: http://code-runner:5000
      RUNNER_SECRET: ${RUNNER_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is not set - run ./scripts/init-env.sh}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is not set - run ./scripts/init-env.sh}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Origins allowed to call the API with credentials (comma-separated).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:7662}
      # Plain HTTP by default; set true when serving over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      AUTO_VALIDATE_CHALLENGES: ${AUTO_VALIDATE_CHALLENGES:-true}
      SEED_DATABASE: ${SEED_DATABASE:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_PLAYER_PASSWORD: ${SEED_PLAYER_PASSWORD:-}
      SEED_DEMO_PLAYERS: ${SEED_DEMO_PLAYERS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: codeclash/frontend:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_PLAYER_APP_URL: ${NEXT_PUBLIC_PLAYER_APP_URL:-}
    image: codeclash/admin:local
    restart: unless-stopped
    ports:
      - "7662:7662"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
  sandbox:

volumes:
  postgres-data:
  redis-data:
  runner-work:
  dind-data:
