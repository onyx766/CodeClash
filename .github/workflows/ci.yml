name: CI

# Only changes to code, images or tooling trigger CI. Automated commits that
# touch nothing else (README.md, test.txt) do not.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'code-runner/**'
      - 'frontend/**'
      - 'admin/**'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'code-runner/**'
      - 'frontend/**'
      - 'admin/**'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Type-check (including tests)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests (includes the real judge runtime)
        run: npm test

  code-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code-runner/package-lock.json
      - run: npm ci
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # next build also runs the TypeScript check
      - run: npm run build

  end-to-end:
    needs: [backend, code-runner, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure
        run: ./scripts/init-env.sh
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Wait for the starter challenges to be validated
        run: |
          for i in $(seq 1 60); do
            if docker compose logs backend | grep -q 'Automatic challenge validation finished'; then
              docker compose logs backend | grep 'ChallengePoolBootstrap'
              exit 0
            fi
            sleep 5
          done
          echo 'Challenge validation did not finish in time' >&2
          exit 1
      - name: Smoke test (full ranked match over REST and Socket.IO)
        run: node scripts/smoke-test.mjs
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
